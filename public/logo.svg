<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e182e"/>
      <stop offset="100%" stop-color="#070814"/>
    </radialGradient>
    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe885"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Diamond Accent Frame -->
  <rect x="106" y="106" width="300" height="300" rx="40" transform="rotate(45 256 256)" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.4"/>
  <rect x="126" y="126" width="260" height="260" rx="32" transform="rotate(45 256 256)" fill="#0d0e21" stroke="url(#goldGrad)" stroke-width="12" filter="url(#goldGlow)"/>

  <!-- Crown / Diamond Top -->
  <path d="M 200,185 L 256,135 L 312,185 L 332,235 L 180,235 Z" fill="url(#goldGrad)" />
  
  <!-- Lower Diamond Facets -->
  <path d="M 180,235 L 256,365 L 332,235 Z" fill="url(#goldGrad)" opacity="0.9" />
  <path d="M 216,235 L 256,365 L 296,235 Z" fill="#fef08a" opacity="0.4" />
  
  <!-- Pink Flame Accent -->
  <path d="M 256,200 C 240,240 220,260 220,285 C 220,305 236,320 256,320 C 276,320 292,305 292,285 C 292,260 272,240 256,200 Z" fill="url(#pinkGrad)"/>
  <path d="M 256,240 C 248,260 238,270 238,285 C 238,295 246,302 256,302 C 266,302 274,295 274,285 C 274,270 264,260 256,240 Z" fill="#fef08a"/>

</svg>
